

# HardenedBSD 14-STABLE, amd64. Same shape as conf/hardenedbsd-15.conf --
# read that one for the ISO-remix rationale and for why VM_RELEASE is the
# bare major while the URL keeps upstream's "-stable" branch directory.
#
# NOTE: release 15 is the one verified locally end to end (remixed ISO boots,
# installer reaches ttyu0, Live System root shell executes dynamic binaries,
# full build green). Release 14 was confirmed only to publish the same LATEST
# layout (bootonly.iso + disc1.iso + MANIFEST/base.txz/kernel.txz); its first
# CI run is what proves the rest.
VM_ISO_LINK="https://installers.hardenedbsd.org/pub/14-stable/amd64/amd64/installer/LATEST/bootonly.iso"
VM_OS_NAME="hardenedbsd"
VM_SSH_PORT=2222
VM_RELEASE=14

VM_LOGIN_TAG="(ttyu0)"

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="pkg install -y "

# NO PACKAGES ON THIS RELEASE. HardenedBSD has retired the binary package
# repository for 14-STABLE -- it still publishes installers, but
# pkg.hardenedbsd.org/HardenedBSD/pkg/FreeBSD:14:amd64/ is a 404 while the
# :15: and :16: repositories answer 200. The guest works the same ABI out for
# itself and cannot even bootstrap pkg:
#
#     pkg: Attempted to fetch .../FreeBSD:14:amd64/Latest/pkg.pkg
#     pkg: Error: Not Found
#     A pre-built version of pkg could not be found for your system.
#
# So the package variables are left EMPTY: build.py then skips the
# pre-install step entirely instead of failing the build on an install that
# can never succeed. Same treatment freebsd-builder gives powerpc64, which
# has no upstream package set either.
#
# The image therefore ships the base system only. rsync and sshfs sync are
# unavailable on 14; scp works because it is in base, and nfs and tar need
# nothing installed in the guest. Release 15 keeps the full set.
VM_RSYNC_PKG=
VM_SSHFS_PKG=
VM_PRE_INSTALL_PKGS=

VM_NIC=virtio

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="nfs,scp,tar"
