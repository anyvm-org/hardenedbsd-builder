

# HardenedBSD 15-STABLE, amd64. HardenedBSD publishes installer ISOs only --
# there is no prebuilt VM image anywhere under installers.hardenedbsd.org --
# and amd64 is the only architecture it builds, so this is the ISO path with
# no arch variants.
#
# VM_ISO_LINK is the UPSTREAM url, but build.py never downloads it directly:
# hooks/host_beforeBuild.py fetches it, remixes it for a serial console, and
# writes the result to the exact path createVM() would have downloaded to
# (createVM skips its own download when that file already exists). See that
# hook for why the remix is unavoidable.
#
# LATEST is a rolling pointer (the branch publishes build-N directories and
# LATEST tracks the newest), so like nextbsd this builder tracks a moving
# upstream rather than a numbered release.
VM_ISO_LINK="https://installers.hardenedbsd.org/pub/15-stable/amd64/amd64/installer/LATEST/bootonly.iso"
VM_OS_NAME="hardenedbsd"
VM_SSH_PORT=2222
VM_RELEASE=15-stable

# Post-install login banner on the serial console. bsdinstall writes the
# installed system's own /boot/loader.conf, NOT the remixed one from the ISO,
# so hooks/host_installOpts.py puts console="comconsole" into the installed
# loader.conf as well -- without that the installed system would go back to
# VGA and never be reachable again. /etc/gettytab substitutes the hostname
# into the issue line, so match the unchanging suffix.
VM_LOGIN_TAG="(ttyu0)"

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_NIC=virtio

# bootonly.iso carries no distribution sets, so the install pulls base.txz and
# kernel.txz over SLIRP from the http.server build.py's startWeb() already
# runs on the host (192.168.122.1:8000). host_installOpts.py pre-downloads
# them into the build cwd. Unlike FreeBSD there is no mirror-fallback dance:
# HardenedBSD publishes MANIFEST, base.txz and kernel.txz in the SAME LATEST
# directory as the ISO, so one base URL covers everything.

# The remixed ISO puts the installer on ttyu0, so the build is driven over the
# serial chardev and never needs VNC or OCR.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# No VM_OPTS: the whole install is driven by hooks/host_installOpts.py
# (scripted bsdinstall over ttyu0), which run_hook("installOpts") invokes in
# place of the OCR-driven processOpts(VM_OPTS) path.

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
